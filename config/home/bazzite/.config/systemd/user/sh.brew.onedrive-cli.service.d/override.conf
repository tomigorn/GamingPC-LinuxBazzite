# Drop-in: hold onedrive --monitor until DNS actually works.
#
# The Homebrew-generated unit starts at login before the network stack has
# settled, so every boot logged two "Could not resolve hostname" errors, and
# the Microsoft Graph WebSocket subscription that the client opens immediately
# afterwards intermittently came back "400 Bad Request / notSupported".
#
# Gating on a real DNS lookup rather than network-online.target, because
# network-online.target is a system target and is not reliably available to
# the systemd *user* manager this unit runs under.
#
# The wait is capped at 120s and always exits 0, so a genuinely offline boot
# still starts the client (it has its own connectivity retry loop) instead of
# failing the unit and leaving sync dead.
#
# Lives in a drop-in so `brew services` regenerating the main unit on upgrade
# cannot clobber it.

[Service]
ExecStartPre=/usr/bin/bash -c 'timeout 120 bash -c "until getent hosts graph.microsoft.com >/dev/null 2>&1; do sleep 2; done"; exit 0'

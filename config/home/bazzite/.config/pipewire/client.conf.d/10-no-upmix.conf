# Disable stereo -> surround upmixing for native PipeWire clients.
# Companion to pipewire-pulse.conf.d/10-no-upmix.conf - see that file for the
# rationale. Both are needed: games reach the graph via pipewire-pulse, while
# native clients read client.conf.
stream.properties = {
    channelmix.upmix = false
}

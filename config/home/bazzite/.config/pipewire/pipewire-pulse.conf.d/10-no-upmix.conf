# Disable stereo -> surround upmixing for PulseAudio clients (Steam/Proton games).
#
# The "Sonar · Game" sink advertises 7.1, which is what makes games output
# discrete surround for the HeSuVi HRTF convolver. But a game that only
# outputs stereo would otherwise get phase-decoded into fake 7.1 and then
# spatialised - inventing positional cues that were never in the signal,
# and double-processing games that already render their own binaural audio.
#
# With upmix disabled: true 7.1 games are unaffected; stereo games map to
# FL/FR and are convolved as two virtual front speakers.
stream.properties = {
    channelmix.upmix = false
}

# Standalone filter (run by discord-surround-downmix.service, not the main
# pipewire daemon) that folds the channels Vesktop's stream capture drops.
#
# Vesktop/venmic only links FL/FR of a shared app. A game on one of the 7.1
# Sonar · Game sinks keeps its dialogue in FC, so the stream loses the voices.
# discord-surround-linker feeds FC/SL/SR/RL/RR of the captured app through
# this node into vencord-screen-share; together with venmic's own FL/FR links
# that adds up to a standard ITU downmix (L = FL + .707·FC + .707·SL + .707·RL).
# LFE is dropped, as in the ITU downmix.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt  args = { }  flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Discord surround downmix"
            media.name       = "Discord surround downmix"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy  name = copyFC }
                    { type = builtin label = mixer name = mixL
                      control = { "Gain 1" = 0.707 "Gain 2" = 0.707 "Gain 3" = 0.707 } }
                    { type = builtin label = mixer name = mixR
                      control = { "Gain 1" = 0.707 "Gain 2" = 0.707 "Gain 3" = 0.707 } }
                ]
                links = [
                    { output = "copyFC:Out" input = "mixL:In 1" }
                    { output = "copyFC:Out" input = "mixR:In 1" }
                ]
                inputs  = [ "copyFC:In" "mixL:In 2" "mixR:In 2" "mixL:In 3" "mixR:In 3" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name      = "discord_surround_downmix"
                node.autoconnect = false
                audio.channels = 5
                audio.position = [ FC SL SR RL RR ]
            }
            playback.props = {
                node.name      = "discord_surround_downmix_out"
                node.autoconnect = false
                node.dont-reconnect = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]

# vkBasalt config - Harry Potter and the Deathly Hallows - Part 1
# The game has no anti-aliasing option, and forcing driver AA on AMD causes
# graphical errors (PCGamingWiki). SMAA runs on the finished frame instead,
# so the game never sees it. CAS afterwards wins back the slight softening.

effects = smaa:cas

# luma edge detection works on any image; depth-based would need depthCapture.
smaaEdgeDetection = luma
smaaThreshold = 0.05
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25

casSharpness = 0.4

# Press this in-game to toggle all effects on/off for an A/B comparison.
toggleKey = Home
enableOnLaunch = True

depthCapture = off

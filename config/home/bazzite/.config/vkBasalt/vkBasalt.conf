# vkBasalt config - Harry Potter and the Half-Blood Prince
# CAS (Contrast Adaptive Sharpening) recovers detail lost to 2009-era
# soft source art, without the halos a naive sharpen produces.

effects = cas
casSharpness = 0.4

# Press this in-game to toggle the effect on/off for an A/B comparison.
toggleKey = Home
enableOnLaunch = True

depthCapture = off

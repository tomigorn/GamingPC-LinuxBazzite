# MangoHud - Harry Potter and the Half-Blood Prince
# Note: the Fix Enhancers wrapper caps the game at 59 FPS, so a steady ~59
# reading is correct and expected. Watch for DIPS below it, not the ceiling.
# Deliberately no fps_limit here - double-limiting would fight the wrapper.

fps
frametime
frame_timing=1

gpu_stats
gpu_temp
gpu_load_change

cpu_stats
cpu_temp

position=top-left
font_size=20
background_alpha=0.4
round_corners=6

toggle_hud=Shift_R+F12

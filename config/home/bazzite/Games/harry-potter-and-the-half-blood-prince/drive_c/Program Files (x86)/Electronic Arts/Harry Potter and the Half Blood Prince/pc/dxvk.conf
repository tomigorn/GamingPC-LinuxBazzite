# DXVK tuning for Harry Potter and the Half-Blood Prince (2009, D3D9)
# The game exposes no anisotropic filtering option of its own, so ground
# textures and long corridors blur badly at shallow angles. Forcing 16x is
# the single biggest visual win here and costs essentially nothing.

d3d9.samplerAnisotropy = 16

# Optional extras - uncomment to try, revert if anything looks wrong.
# Forces multisampling on the swapchain (untested with the Fix Enhancers wrapper):
# d3d9.forceSwapchainMSAA = 4
# Slight negative LOD bias sharpens textures but can cause shimmer in motion:
# d3d9.samplerLodBias = -0.5

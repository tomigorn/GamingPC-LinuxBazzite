# DXVK tuning for Harry Potter and the Deathly Hallows - Part 1 (2010, D3D9)
# The game has no anisotropic filtering option of its own (PCGamingWiki), so
# floors and long corridors blur at shallow angles. Forcing 16x fixes that
# and costs essentially nothing.

d3d9.samplerAnisotropy = 16

# Not enabled: PCGamingWiki notes that forcing antialiasing on AMD cards
# causes graphical errors in this game.
